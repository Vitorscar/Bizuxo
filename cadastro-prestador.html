<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta de prestador · Bizuxo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  :root {
    --bg-app:#0B0B0D; --bg-elevated:#1B1C1F; --surface:#FFFFFF; --surface-soft:#F4F4F2;
    --ink:#101113; --ink-soft:#6B6E76; --ink-faint:#9A9CA3;
    --accent:#05C167; --accent-ink:#04572C; --accent-soft:#E1F9EC;
    --alert:#FF3B30; --alert-ink:#8C1810; --alert-soft:#FFE9E7;
    --border:#E7E7E4; --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    --font-display:'Sora', sans-serif; --font-body:'Inter', sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; }
  body { background:var(--surface-soft); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; cursor:pointer; }

  .phone { max-width:520px; margin:0 auto; min-height:100vh; background:var(--surface-soft); }

  header {
    background:var(--bg-app); color:#fff; padding:20px 24px 26px; border-radius:0 0 var(--radius-lg) var(--radius-lg);
  }
  .header-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .brand { font-family:var(--font-display); font-weight:800; font-size:1rem; }
  .brand span { color:var(--alert); }
  .back { font-size:0.78rem; color:#B6B8BE; border:1px solid rgba(255,255,255,0.18); padding:6px 12px; border-radius:100px; transition: 0.2s; }
  .back:hover { background: rgba(255,255,255,0.1); color: #fff; }

  .type-toggle { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .type-card {
    background:var(--bg-elevated); border:1.5px solid transparent; border-radius:var(--radius-md);
    padding:14px 12px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .type-card .icon { font-size:1.3rem; margin-bottom:6px; }
  .type-card .name { font-family:var(--font-display); font-weight:700; font-size:0.85rem; color:#fff; }
  .type-card.selected { border-color:var(--alert); background:rgba(255,59,48,0.14); }

  .wrap { padding:24px 22px 60px; }
  .intro { margin-bottom:20px; }
  .intro h1 { font-family:var(--font-display); font-size:1.35rem; font-weight:700; margin:0 0 6px; }
  .intro p { font-size:0.85rem; color:var(--ink-soft); margin:0; }

  .card { background:var(--surface); border-radius:var(--radius-lg); padding:22px 20px; margin-bottom:14px; }
  .card-label { font-family:var(--font-display); font-size:0.85rem; font-weight:700; color:var(--ink); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .card-label .dot { width:7px; height:7px; border-radius:50%; background:var(--alert); }

  .field { margin-bottom:16px; }
  .field:last-child { margin-bottom:0; }
  label { display:block; font-size:0.78rem; font-weight:600; color:var(--ink); margin-bottom:7px; }
  input {
    width:100%; font-family:var(--font-body); font-size:0.92rem; color:var(--ink);
    background:var(--surface-soft); border:1.5px solid transparent; border-radius:var(--radius-sm);
    padding:13px 14px; outline:none; transition:border-color .15s ease, background .15s ease;
  }
  input:focus { border-color:var(--ink); background:var(--surface); }
  input[readonly] { background: var(--bg-elevated); color: var(--ink-soft); cursor: not-allowed; }
  .field-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  /* ============================================================
     CHIPS DE SELEÇÃO MÚLTIPLA (Melhorados)
     ============================================================ */
  .chip-select { display:flex; gap:8px; flex-wrap:wrap; }
  
  .chip-option {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 14px; font-size: 0.85rem; font-weight: 600;
    color: var(--ink-soft); background: var(--surface-soft);
    border: 1.5px solid var(--border); border-radius: 100px;
    cursor: pointer; transition: all 0.2s ease;
    position: relative;
    padding-right: 32px; /* Espaço para o checkmark */
    user-select: none;
  }
  
  .chip-option:hover { 
    border-color: var(--ink); 
    color: var(--ink); 
    transform: translateY(-1px);
  }
  
  /* Estado Selecionado (Múltipla escolha) */
  .chip-option.selected {
    background: var(--alert); 
    color: #fff; 
    border-color: var(--alert);
    box-shadow: 0 2px 8px rgba(255, 59, 48, 0.25);
  }
  
  /* Checkmark que aparece apenas quando selecionado */
  .chip-option.selected::after {
    content: '✓';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-weight: 800;
    font-size: 0.9rem;
  }

  .chip-option.more-services {
    border-style: dashed; 
    color: var(--ink-soft); 
    background: transparent;
    padding-right: 14px; /* Sem checkmark no botão "mais" */
  }
  .chip-option.more-services:hover { 
    border-color: var(--ink); 
    color: var(--ink); 
  }

  .extra-services {
    display: none; flex-wrap: wrap; gap: 8px; margin-top: 12px;
    padding-top: 12px; border-top: 1px dashed var(--border);
    animation: fadeIn 0.3s ease;
  }
  .extra-services.show { display: flex; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

  .create-btn {
    width:100%; background:var(--ink); color:#fff; border:none; padding:16px; margin-top:6px;
    font-family:var(--font-display); font-weight:700; font-size:0.95rem; border-radius:var(--radius-sm);
    transition:opacity .15s, background .15s;
  }
  .create-btn:active { opacity:0.85; }
  .create-btn:disabled { opacity:0.6; cursor:not-allowed; background: var(--ink-faint); }
  
  .terms { font-size:0.75rem; color:var(--ink-faint); text-align:center; margin-top:14px; }
  .login-note { text-align:center; font-size:0.85rem; color:var(--ink-soft); margin-top:22px; }
  .login-note a { color:var(--ink); font-weight:700; text-decoration: underline; }

  #cpfStatus { display: block; font-size: 0.75rem; margin-top: 6px; font-weight: 500; min-height: 1.2em; }
  #selection-count { font-size: 0.75rem; color: var(--accent-ink); font-weight: 600; margin-top: 8px; display: block; }

  @media (max-width:480px) { .field-row { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="phone">
  <header>
    <div class="header-top">
      <div class="brand">Bizu<span>xo</span></div>
      <a class="back" href="index.html">já tenho conta</a>
    </div>
    <div class="type-toggle">
      <a href="cadastro-cliente.html" class="type-card">
        <div class="icon">🧑</div>
        <div class="name">Sou cliente</div>
      </a>
      <div class="type-card selected">
        <div class="icon">🛠️</div>
        <div class="name">Sou prestador</div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="intro">
      <h1>Criar conta de prestador</h1>
      <p>Grátis para começar. Leva menos de 2 minutos.</p>
    </div>

    <form id="cadastroPrestadorForm">
      <div class="card">
        <div class="card-label"><span class="dot"></span>Seus dados</div>

        <div class="field">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Ex: Carlos Silva" required>
        </div>

        <div class="field">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required>
          <small id="cpfStatus"></small>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="whatsapp">WhatsApp</label>
            <input type="tel" id="whatsapp" placeholder="(61) 90000-0000" maxlength="15" inputmode="numeric" required>
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="voce@email.com" required>
          </div>
        </div>

        <div class="field">
          <label for="senha">Criar senha</label>
          <input type="password" id="senha" placeholder="mínimo 8 caracteres" minlength="8" required>
        </div>
      </div>

      <div class="card">
        <div class="card-label"><span class="dot"></span>Sobre seu trabalho</div>
        
        <div class="field">
          <label>Tipos de serviço que você presta <span style="color:var(--ink-faint); font-weight:400;">(selecione um ou mais)</span></label>
          
          <div class="chip-select" id="chipContainer">
            <button type="button" class="chip-option" data-value="Elétrica">⚡ Elétrica</button>
            <button type="button" class="chip-option" data-value="Hidráulica">🚿 Hidráulica</button>
            <button type="button" class="chip-option" data-value="Ar-condicionado">❄️ Ar-condicionado</button>
            <button type="button" class="chip-option" data-value="Pintura">🎨 Pintura</button>
            <button type="button" class="chip-option" data-value="Montagem">🪵 Montagem</button>
            
            <button type="button" class="chip-option more-services" id="moreServices">+ ver outras opções</button>
          </div>

          <div class="extra-services" id="extraServices">
            <button type="button" class="chip-option" data-value="Limpeza">🧹 Limpeza</button>
            <button type="button" class="chip-option" data-value="Jardinagem">🌿 Jardinagem</button>
            <button type="button" class="chip-option" data-value="Marcenaria">🪚 Marcenaria</button>
            <button type="button" class="chip-option" data-value="Serralheria">⚙️ Serralheria</button>
            <button type="button" class="chip-option" data-value="Construção">🧱 Construção</button>
            <button type="button" class="chip-option" data-value="Alvenaria">🏗️ Alvenaria</button>
            <button type="button" class="chip-option" data-value="Barbearia">💈 Barbearia</button>
            <button type="button" class="chip-option" data-value="Manicure">💅 Manicure</button>
            <button type="button" class="chip-option" data-value="Estética">💆 Estética</button>
            <button type="button" class="chip-option" data-value="Fotografia">📷 Fotografia</button>
            <button type="button" class="chip-option" data-value="Informática">💻 Informática</button>
            <button type="button" class="chip-option" data-value="Assistência técnica">🔧 Assistência técnica</button>
            <button type="button" class="chip-option" data-value="Mudanças">🚚 Mudanças</button>
            <button type="button" class="chip-option" data-value="Fretes">🛻 Fretes</button>
          </div>

          <span id="selection-count">0 serviços selecionados</span>
          <input type="hidden" id="servicos" name="servicos">
        </div>

        <div class="field-row" style="margin-top:16px;">
          <div class="field">
            <label for="cep">CEP</label>
            <input type="text" id="cep" placeholder="00000-000" maxlength="9" inputmode="numeric" required>
          </div>
          <div class="field">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" placeholder="Cidade" readonly required>
          </div>
        </div>

        <div class="field">
          <label for="bairro">Região que atende (Bairro)</label>
          <input type="text" id="bairro" placeholder="Ex: Asa Norte, Sudoeste..." required>
        </div>
      </div>

      <button type="submit" class="create-btn" id="submitBtn">Criar conta grátis</button>
      <div class="terms">Ao continuar, você concorda com os <a href="termos.html" style="color:var(--ink-soft); text-decoration:underline;">termos do Bizuxo</a>.</div>
    </form>

    <div class="login-note">Já tem conta? <a href="index.html">Entrar</a></div>
  </div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-cliente.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>

<script>
  // ==========================================
  // 1. LÓGICA DE SELEÇÃO MÚLTIPLA DOS CHIPS
  // ==========================================
  function attachChipListeners() {
    const chips = document.querySelectorAll('.chip-option');
    
    chips.forEach(chip => {
      chip.addEventListener('click', function(e) {
        e.preventDefault(); // Previne qualquer comportamento padrão de botão

        if (this.id === 'moreServices') {
          document.getElementById('extraServices').classList.add('show');
          this.style.display = 'none'; // Esconde o botão "ver mais" após clicar
        } else {
          // TOGGLE permite selecionar E DESELECIONAR (múltipla escolha)
          this.classList.toggle('selected');
        }
        
        updateHiddenInput();
      });
    });
  }

  function updateHiddenInput() {
    // Pega TODOS os chips que tiverem a classe 'selected'
    const selectedChips = document.querySelectorAll('.chip-option.selected');
    
    // Cria um array apenas com os valores (data-value) dos chips selecionados
    const selectedValues = Array.from(selectedChips)
      .filter(chip => chip.id !== 'moreServices')
      .map(chip => chip.dataset.value);

    // Salva no input hidden como string JSON
    document.getElementById('servicos').value = JSON.stringify(selectedValues);

    // Atualiza o contador visual para o usuário
    const count = selectedValues.length;
    const countText = document.getElementById('selection-count');
    countText.textContent = count === 0 
      ? 'Selecione pelo menos 1 serviço' 
      : `${count} serviço${count > 1 ? 's' : ''} selecionado${count > 1 ? 's' : ''}`;
    
    countText.style.color = count > 0 ? 'var(--accent-ink)' : 'var(--ink-faint)';
  }

  // Tenta carregar do banco, com fallback para o HTML estático
  async function carregarServicos() {
    try {
      if (typeof supabase !== 'undefined') {
        const { data, error } = await supabase.from('service_types').select('id, nome, icone').order('nome');
        
        if (data && data.length > 0) {
          const container = document.getElementById('chipContainer');
          const moreBtn = document.getElementById('moreServices');
          container.innerHTML = ''; // Limpa os estáticos

          data.forEach(servico => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'chip-option';
            btn.dataset.value = servico.nome;
            btn.dataset.id = servico.id;
            btn.textContent = `${servico.icone || '🔧'} ${servico.nome}`;
            container.appendChild(btn);
          });
          
          container.appendChild(moreBtn); // Reinsere o botão "+ ver outras"
        }
      }
    } catch (e) {
      console.log("Usando lista de serviços padrão (fallback).");
    }
    // Aplica os listeners (funciona tanto para dados do DB quanto HTML estático)
    attachChipListeners();
  }

  carregarServicos();

  // ==========================================
  // 2. MÁSCARAS DE INPUT
  // ==========================================
  const cpfInput = document.getElementById('cpf');
  const cpfStatus = document.getElementById('cpfStatus');

  cpfInput.addEventListener('input', function () {
    let value = this.value.replace(/\D/g, '').slice(0, 11);
    if (value.length > 9) value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
    else if (value.length > 6) value = value.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
    else if (value.length > 3) value = value.replace(/(\d{3})(\d{1,3})/, '$1.$2');
    this.value = value;

    if (value.length === 14) {
      if (validarCPF(value)) {
        cpfStatus.textContent = '✓ CPF válido';
        cpfStatus.style.color = 'var(--accent)';
      } else {
        cpfStatus.textContent = '✕ CPF inválido';
        cpfStatus.style.color = 'var(--alert)';
      }
    } else {
      cpfStatus.textContent = '';
    }
  });

  const whatsappInput = document.getElementById('whatsapp');
  whatsappInput.addEventListener('input', function() {
    let value = this.value.replace(/\D/g, '').slice(0, 11);
    if (value.length > 6) {
      value = value.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
    } else if (value.length > 2) {
      value = value.replace(/(\d{2})(\d{0,5})/, '($1) $2');
    }
    this.value = value;
  });

  // ==========================================
  // 3. VALIDAÇÃO DE CPF
  // ==========================================
  function validarCPF(cpf) {
    cpf = cpf.replace(/\D/g, '');
    if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;

    let soma = 0;
    for (let i = 0; i < 9; i++) soma += Number(cpf[i]) * (10 - i);
    let resto = (soma * 10) % 11;
    if (resto === 10) resto = 0;
    if (resto !== Number(cpf[9])) return false;

    soma = 0;
    for (let i = 0; i < 10; i++) soma += Number(cpf[i]) * (11 - i);
    resto = (soma * 10) % 11;
    if (resto === 10) resto = 0;
    
    return resto === Number(cpf[10]);
  }

  // ==========================================
  // 4. CONSULTA CEP (VIACEP)
  // ==========================================
  const cepInput = document.getElementById('cep');
  const cidadeInput = document.getElementById('cidade');
  const bairroInput = document.getElementById('bairro');

  cepInput.addEventListener('input', function () {
    let value = this.value.replace(/\D/g, '').slice(0, 8);
    if (value.length > 5) value = value.replace(/(\d{5})(\d{1,3})/, '$1-$2');
    this.value = value;

    if (value.length === 8) {
      buscarCEP(value);
    }
  });

  async function buscarCEP(cep) {
    cidadeInput.value = 'Buscando...';
    bairroInput.value = 'Buscando...';

    try {
      const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
      const dados = await resposta.json();

      if (dados.erro) {
        cidadeInput.value = '';
        bairroInput.value = '';
        alert('CEP não encontrado. Verifique o número digitado.');
        return;
      }

      cidadeInput.value = dados.localidade || '';
      bairroInput.value = dados.bairro || '';
      if(dados.bairro) bairroInput.focus();
    } catch (erro) {
      cidadeInput.value = '';
      bairroInput.value = '';
      alert('Não foi possível consultar o CEP. Verifique sua conexão.');
    }
  }

  // ==========================================
  // 5. SUBMIT DO FORMULÁRIO
  // ==========================================
  document.getElementById('cadastroPrestadorForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const servicosSelecionados = JSON.parse(document.getElementById('servicos').value || '[]');

    if (servicosSelecionados.length === 0) {
      alert('Por favor, selecione pelo menos um tipo de serviço que você presta.');
      return;
    }

    if (!validarCPF(cpfInput.value)) {
      alert('Por favor, insira um CPF válido.');
      cpfInput.focus();
      return;
    }

    const dados = {
      nome: document.getElementById('nome').value.trim(),
      whatsapp: document.getElementById('whatsapp').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('senha').value,
      cidade: document.getElementById('cidade').value.trim(),
      bairro: document.getElementById('bairro').value.trim(),
      tipo: 'prestador',
      service_types: servicosSelecionados // Aqui vai o array com TODOS os serviços selecionados
    };

    const btn = document.getElementById('submitBtn');
    const originalText = btn.textContent;
    btn.textContent = 'Criando conta...';
    btn.disabled = true;

    try {
      const result = await Auth.register(dados);

      if (result.success) {
        window.location.href = '../prestador/onboarding-prestador.html'; // Redireciona para a página de onboarding do prestador
      } else {
        alert('Erro ao criar conta: ' + (result.error || 'Tente novamente.'));
        btn.textContent = originalText;
        btn.disabled = false;
      }
    } catch (error) {
      console.error(error);
      alert('Ocorreu um erro inesperado. Tente novamente.');
      btn.textContent = originalText;
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
